name: Pruebas de la API de notas

on:
  push:
    branches: [main, feature/notas, feature/ia]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:dev
